const paintedAntColors = new Map();

function paintedAntPalette(color) {
  const cached = paintedAntColors.get(color);

  const ink = Number.parseInt(color.slice(1), 16);

  const mix = (tone, amount) =>
    `rgb(${rgb.map((channel, i) => Math.round(channel * (1 - amount) + tone[i] * amount)).join(",")})`;
  const palette = {
    body: mix([210, 166, 108], 0.07),
    shade: mix([43, 34, 32], 0.37),
    outline: mix([33, 31, 25], 0.64),
    shine: mix([255, 240, 199], 0.52),
    tile: mix([255, 234, 185], 0.24)
  };
  paintedAntColors.set(color, palette);
  return palette;
}

  ctx.beginPath();
  ctx.moveTo(1, 0);
  ctx.quadraticCurveTo(11, -5, 18, -7);
  ctx.strokeStyle = '#eff7ba99';
  ctx.stroke();
  ctx.restore();
}

function shellFlower(ctx, x, y, radius, tint = '#fff7d6') {
  for (let i = 0; i < 5; i++) {
    const angle = i * Math.PI * 0.4 - 1.2;
    const px = x + Math.cos(angle) * radius * 0.67;
    const py = y + Math.sin(angle) * radius * 0.67;
    shellEllipse(ctx, px, py, radius * 0.51, radius * 0.36, tint, angle, '#ad925966', 0.65);
  }
  shellEllipse(ctx, x, y, radius * 0.38, radius * 0.34, '#edb15a', 0, '#be873e', 0.5);
  shellEllipse(ctx, x - radius * 0.1, y - radius * 0.14, radius * 0.14, radius * 0.12, '#ffe7a7');
}

function shellVine(ctx, x, y, flipX = 1, flipY = 1, size = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flipX * size, flipY * size);
  ctx.beginPath();
  ctx.moveTo(5, 30);
  ctx.bezierCurveTo(-2, 19, 0, 9, 13, 6);
  ctx.quadraticCurveTo(20, 2, 31, 6);
  ctx.strokeStyle = '#68834b';
  ctx.lineWidth = 2;
  ctx.stroke();
  shellLeaf(ctx, 7, 13, -1.65, 0.7, false);
  shellLeaf(ctx, 4, 25, -2.56, 0.56, true);
  shellLeaf(ctx, 15, 7, -0.28, 0.63, true);
  shellLeaf(ctx, 21, 6, 0.55, 0.44, false);
  shellFlower(ctx, 8, 7, 5.6);
  shellFlower(ctx, 3, 18, 3.35, '#ffe9c1');
  ctx.restore();
}

function shellWood(ctx, x, y, w, h, radius = 14) {

}

function shellPaper(ctx, x, y, w, h, radius = 11) {

}

function shellCoin(ctx, x, y, radius) {

}

function shellIcon(ctx, kind, x, y, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (kind === 'back') {
    shellStroke(ctx, [[5,-7],[-3,0],[5,7]], color, 3);
  } else if (kind === 'sound') {
    ctx.beginPath();
    ctx.moveTo(-10,-3); ctx.lineTo(-6,-3); ctx.lineTo(-1,-7); ctx.lineTo(-1,7); ctx.lineTo(-6,3); ctx.lineTo(-10,3); ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 1.8;
    for (const r of [6, 9]) { ctx.beginPath(); ctx.arc(-1, 0, r, -0.7, 0.7); ctx.stroke(); }
  } else if (kind === 'restart') {
    ctx.beginPath(); ctx.arc(0, 1, 11, -2.74, 2.04);
    ctx.strokeStyle = color; ctx.lineWidth = 3.2; ctx.stroke();
    shellStroke(ctx, [[-12,-10],[-10,-3],[-3,-5]], color, 3.1);
    shellLeaf(ctx, -5, 3, -0.15, 0.36, true);
  } else if (kind === 'speed') {
    ctx.beginPath(); ctx.moveTo(2,-16); ctx.lineTo(-13,3); ctx.lineTo(-2,3); ctx.lineTo(-5,16);
    ctx.lineTo(13,-4); ctx.lineTo(3,-4); ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = '#975721'; ctx.lineWidth = 0.9; ctx.stroke();
    shellStroke(ctx, [[3,-11],[-5,-1],[0,-1]], '#fff7d7', 1.25);
  } else if (kind === 'pick') {
    ctx.beginPath();
    ctx.moveTo(-12,3); ctx.bezierCurveTo(-12,-2,-8,-3,-5,1); ctx.lineTo(-3,3);
    ctx.lineTo(-3,-11); ctx.bezierCurveTo(-3,-16,3,-16,3,-11); ctx.lineTo(3,-3);
    ctx.bezierCurveTo(6,-5,9,-2,9,-1); ctx.bezierCurveTo(12,-3,14,0,14,4);
    ctx.bezierCurveTo(13,13,10,16,3,16); ctx.bezierCurveTo(-2,16,-5,13,-12,3);
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = '#517966'; ctx.lineWidth = 1.3; ctx.stroke();
    shellEllipse(ctx, -3, -5, 1.2, 4.5, '#fffef0aa');
  } else if (kind === 'shuffle') {
    for (const [dx, dy, angle, fill] of [[-5,-5,-0.2,'#f8d0a3'],[6,4,0.2,'#a8d4ab']]) {
      ctx.save(); ctx.translate(dx,dy); ctx.rotate(angle);
      shellRect(ctx,-6,-6,12,12,2.5,fill,'#645747',1.1);
      shellStroke(ctx,[[-3,-3],[2,-3]],'#fff8deaa',1);
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0,0,16,-2.96,-0.69); ctx.strokeStyle=color; ctx.lineWidth=1.6; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,16,0.18,2.48); ctx.stroke();
    shellStroke(ctx,[[10,-10],[13,-10],[12,-14]],color,1.6);
    shellStroke(ctx,[[-10,10],[-13,10],[-12,14]],color,1.6);
  }
  ctx.restore();
}

function shellTool(ctx, x, tag, icon, colors, ink, count) {
  const y = 860;
  shellEllipse(ctx, x, y + 20, 24, 7, '#4c4d2d35');
  shellEllipse(ctx, x, y, 25, 24, shellGradient(ctx, y - 24, 48, colors), 0, ink, 1.15);
  shellEllipse(ctx, x, y - 0.5, 22, 21, '#ffffff14', 0, '#fff5dcaa', 0.95);
  ctx.beginPath();
  ctx.ellipse(x, y, 19, 18, 0, 3.6, 5.7);
  ctx.strokeStyle = '#fff6dc7a'; ctx.lineWidth = 0.8; ctx.stroke();
  shellIcon(ctx, icon, x, y - 0.5, icon === 'restart' || icon === 'shuffle' ? '#fff4d8' : '#fff0c0');
  if (count) {
    shellRect(ctx, x + 10, y + 10, 19, 15, 6, '#fff1ce', ink, 0.8);
    shellText(ctx, count, x + 19.5, y + 18.2, 9.5, ink);
  }
  shellPaper(ctx, x - 31, 887, 62, 21, 7);
  shellText(ctx, tag, x, 898, 11.8, '#604832');
}

function shellNest(ctx) {

  for (const [x,y,rx,ry,angle] of pebbles) {

}

function loadImage(src) {
  const image = new Image();
  image.src = src;
  return image;
}

function setupAudio() {
  if (!soundEnabled) return;
  if (!audioContext) {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    audioContext = new Audio();
    mix = audioContext.createGain();
    mix.gain.value = 0.58;
    mix.connect(audioContext.destination);
    for (const [name, src] of Object.entries(audioSources)) {
      if (!src) continue;
      const decoded = atob(src.split(",")[1]);
      const bytes = Uint8Array.from(decoded, char => char.charCodeAt(0));
      audioContext.decodeAudioData(bytes.buffer).then(buffer => { samples[name] = buffer; }).catch(() => {});
    }
  }
  if (audioContext.state === "suspended") audioContext.resume().catch(() => {});
}

function playSound(name) {
  if (!soundEnabled || !audioContext || audioContext.state !== "running") return;
  const now = audioContext.currentTime;
  if (name === "pop" && now - lastPop < 0.037) return;
  if (name === "pop") lastPop = now;
  if (samples[name]) {
    const audio = audioContext.createBufferSource();
    audio.buffer = samples[name];
    audio.connect(mix);
    audio.start();
    return;
  }
  const oscillator = audioContext.createOscillator();
  const envelope = audioContext.createGain();
  const kinds = { pop: [445, 1160, 0.075, 0.24], tap: [485, 280, 0.105, 0.20], puff: [125, 67, 0.20, 0.17] };
  const [begin, end, duration, volume] = kinds[name];
  oscillator.type = name === "tap" ? "triangle" : "sine";
  oscillator.frequency.setValueAtTime(begin * (0.97 + Math.random() * 0.06), now);
  oscillator.frequency.exponentialRampToValueAtTime(end, now + duration * 0.48);
  envelope.gain.setValueAtTime(0.001, now);
  envelope.gain.exponentialRampToValueAtTime(volume, now + 0.009);
  envelope.gain.exponentialRampToValueAtTime(0.001, now + duration);
  oscillator.connect(envelope).connect(mix);
  oscillator.start(now);
  oscillator.stop(now + duration);
}

function newLevel(index) {
  levelIndex = index;
  level = LEVELS[index];
  const grid = Int16Array.from(level.grid);
  const remainingByColor = level.colors.map(() => 0);
  grid.forEach(color => { if (color >= 0) remainingByColor[color]++; });
  const active = Array(5).fill(null);
  const columns = Array.from({ length: 5 }, () => []);
  const delayed = level.colors.map(() => []);
  let additionalColumn = 0;
  const assign = (piece, position, isActive) => {
    if (!piece || !level.colors[piece.color]) return;
    const card = { color: piece.color, count: piece.count, nextAt: time + 0.1, face: piece.face };
    remainingByColor[card.color] = Math.max(0, remainingByColor[card.color] - card.count);
    if (isActive) active[position] = card;
    else columns[position % 5].push(card);
  };
  (level.active || []).forEach((piece, index) => assign(piece, index, true));
  if (level.columns) {
    level.columns.forEach((column, index) => column.forEach(piece => assign(piece, index, false)));
  } else {
    (level.queue || []).forEach((piece, index) => assign(piece, index, false));
  }
  for (let index = CELL_COUNT - 1; index >= 0; index--) {
    if (grid[index] >= 0) delayed[grid[index]].push(index);
  }
  const order = remainingByColor.map((count, color) => ({ count, color }))
    .filter(entry => entry.count > 0)
    .sort((a, b) => (delayed[b.color][0] ?? -1) - (delayed[a.color][0] ?? -1));
  while (order.some(entry => entry.count > 0)) {
    for (const entry of order) {
      if (entry.count <= 0) continue;
      const count = Math.min(40, entry.count);
      columns[additionalColumn++ % 5].push({ color: entry.color, count });
      entry.count -= count;
    }
  }
  game = {
    grid, active, columns, ants: [], sparks: [], puffs: [], reserved: new Set(),
    remaining: grid.reduce((sum, color) => sum + (color >= 0), 0), score: index === 0 ? 7050 : 0,
    launch: null, slides: Array(5).fill(0), scan: null, recentTargets: [], won: false
  };
  renderTiles();
  updateControls();
}

function reset() {
  totalScore = 178250;
  stamina = 362;
  coins = 1216;
  chests = 443;
  speed = 1;
  freeSelection = false;
  freeUses = 3;
  shuffleUses = 2;
  newLevel(0);
}

function gridCenter(index) {
  return { x: BOARD_X + (index % COLUMNS + 0.5) * CELL_W, y: BOARD_Y + (Math.floor(index / COLUMNS) + 0.5) * CELL_H };
}

function scanBoard() {
  const cameFrom = new Int16Array(CELL_COUNT).fill(-2);
  const steps = new Int16Array(CELL_COUNT);
  const frontier = [];
  const targets = level.colors.map(() => []);
  for (let index = CELL_COUNT - COLUMNS; index < CELL_COUNT; index++) {
    cameFrom[index] = -1;
    const color = game.grid[index];
    if (color < 0) frontier.push(index);
    else targets[color].push(index);
  }
  for (let head = 0; head < frontier.length; head++) {
    const current = frontier[head];
    for (const adjacent of NEIGHBORS[current]) {
      if (cameFrom[adjacent] !== -2) continue;
      cameFrom[adjacent] = current;
      steps[adjacent] = steps[current] + 1;
      const color = game.grid[adjacent];
      if (color < 0) frontier.push(adjacent);
      else targets[color].push(adjacent);
    }
  }
  game.scan = { cameFrom, steps, targets };
}

function getTarget(color) {
  if (!game.scan) scanBoard();
  const { steps, targets } = game.scan;
  let best = -1;
  let bestRank = Infinity;
  for (const index of targets[color]) {
    if (game.reserved.has(index)) continue;
    const col = index % COLUMNS;
    const recentPenalty = game.recentTargets.reduce((sum, previous) => sum + Math.max(0, 5 - Math.abs(col - previous)), 0);
    const rank = steps[index] + recentPenalty * 0.22 + Math.abs(col - 22.5) * 0.045;
    if (rank < bestRank) {
      best = index;
      bestRank = rank;
    }
  }
  return best;
}

function compactPath(points) {
  const result = [points[0]];
  for (let i = 1; i < points.length - 1; i++) {
    const a = result[result.length - 1], b = points[i], c = points[i+1];
    if ((a.x === b.x && b.x === c.x) || (a.y === b.y && b.y === c.y)) continue;
    result.push(b);
  }
  result.push(points[points.length - 1]);
  return result;
}

function antPath(index, slot) {
  const from = game.scan.cameFrom;
  const gridPath = [];
  for (let cursor = index; cursor >= 0; cursor = from[cursor]) gridPath.push(gridCenter(cursor));
  gridPath.reverse();
  const edge = gridPath[0];
  const offset = Math.sign(edge.x - NEST.x) * Math.min(30, Math.abs(edge.x - NEST.x) * 0.6);
  const entry = [{ x:NEST.x, y:NEST.y }, { x:NEST.x + offset, y:609 }, { x:edge.x, y:596 }, { x:edge.x, y:BOARD_FLOOR }];
  const trail = compactPath(entry.concat(gridPath));
  game.ants.push({
    index, slot, color: game.grid[index], trail, at: 1, point: { ...trail[0] }, angle: -Math.PI / 2,
    age: 0, carry: false, pause: 0, pace: 143 + Math.random() * 10, contact: false,
    entryX: ACTIVE_X[slot] + 32
  });
  game.reserved.add(index);
  game.recentTargets.push(index % COLUMNS);
  if (game.recentTargets.length > 12) game.recentTargets.shift();
}

function dispatch() {
  for (let slot = 0; slot < game.active.length; slot++) {
    const card = game.active[slot];
    if (!card || card.nextAt > time) continue;
    if (!game.grid.includes(card.color) && !game.ants.some(ant => ant.color === card.color && !ant.carry)) {
      game.active[slot] = null;
      puff(0.48);
      updateControls();
      continue;
    }
    const target = getTarget(card.color);
    if (target < 0) {
      card.nextAt = time + 0.13;
      continue;
    }
    antPath(target, slot);
    card.nextAt = Math.max(card.nextAt + 0.323, time + 0.25);
    if (--card.count === 0) {
      game.active[slot] = null;
      puff(0.75);
    }
    updateControls();
  }
}

function collect(ant) {
  const index = ant.index;
  game.grid[index] = -1;
  eraseTile(index);
  game.reserved.delete(index);
  game.scan = null;
  game.remaining--;
  game.score += 10;
  totalScore += 10;
  game.sparks.push({ ...gridCenter(index), age: 0, color: level.colors[ant.color] });
  ant.carry = true;
  ant.pause = 0.11;
  ant.at = ant.trail.length - 2;
}

function moveAnt(ant, dt) {
  ant.age += dt;
  if (ant.age < 0.125) return true;
  if (ant.pause > 0) {
    ant.pause -= dt;
    return true;
  }
  let step = ant.pace * dt * (ant.carry ? 1.10 : 1);
  while (step > 0) {
    const next = ant.trail[ant.at];
    if (!next) {
      if (ant.carry) {
        if (Math.random() < 0.10) puff(0.30);
        return false;
      }
      if (!ant.contact) {
        ant.contact = true;
        ant.pause = 0.09;
        playSound("pop");
        return true;
      }
      collect(ant);
      return true;
    }
    const dx = next.x - ant.point.x, dy = next.y - ant.point.y;
    const distance = Math.hypot(dx, dy);
    if (distance > 0.001) ant.angle = Math.atan2(dy, dx);
    if (distance > step) {
      ant.point.x += dx * step / distance;
      ant.point.y += dy * step / distance;
      return true;
    }
    ant.point = { ...next };
    step -= distance;
    ant.at += ant.carry ? -1 : 1;
  }
  return true;
}

function puff(strength) {
  game.puffs.push({ age: 0, strength, phase: Math.random() * 6.28 });
  if (strength > 0.6) {
    game.sparks.push({ x: NEST.x + 13, y: NEST.y - 6, age: 0, reward:true });
    chests++;
    playSound("puff");
  }
}

function update(dt) {
  time += dt;
  dispatch();
  game.ants = game.ants.filter(ant => moveAnt(ant, dt));
  game.sparks = game.sparks.filter(spark => (spark.age += dt) < 0.35);
  game.puffs = game.puffs.filter(cloud => (cloud.age += dt) < 0.68);
  if (game.remaining === 0 && !game.won) {
    game.won = true;
    game.winAt = time;
  }
  if (game.won && time > game.winAt + 1.2 && !panel.open) {
    game.winAt = Infinity;
    if (levelIndex + 1 < LEVELS.length) {
      totalScore += 3000;
      showPanel("完成啦！", "方块已全部搬回蚁穴。", [{ text:"下一张", action:() => newLevel(levelIndex + 1) }]);
    } else {
      showPanel("完成啦！", "两张图案都已清空。", [{ text:"再玩一次", action:reset }]);
    }
  }
}

function choose(column, row) {
  if (game.won || (row > 0 && !freeSelection)) return;
  const card = game.columns[column][row];
  if (!card) return;
  const slot = game.active.indexOf(null);
  if (slot < 0) {
    if (!game.ants.length && !game.active.some(piece => getTarget(piece.color) >= 0)) {
      showPanel("暂存槽已满", "当前颜色暂时没有可搬运的方块。腾出一个位置后继续。", [
        { text:"继续等待" }, { text:"移回一组", action:releaseSlot }
      ]);
    }
    return;
  }
  setupAudio();
  playSound("tap");
  game.columns[column].splice(row, 1);
  if (freeSelection) {
    freeUses--;
    freeSelection = false;
  }
  const next = { ...card, nextAt: time + 0.46, chosenAt: time };
  game.active[slot] = next;
  game.launch = { card: { ...card }, fromX: QUEUE_X[column], fromY: 726 + row * CARD_PITCH, toX: ACTIVE_X[slot], start: time };
  game.slides[column] = row === 0 ? time + 0.235 : 0;
  stamina = Math.max(0, stamina - 1);
  coins += 2;
  puff(0.32);
  updateControls();
}

function releaseSlot() {
  const slot = game.active.findIndex(card => card && getTarget(card.color) < 0);
  if (slot < 0) return;
  const [column] = game.columns.reduce((best, deck, i) => deck.length < best[1] ? [i, deck.length] : best, [0, Infinity]);
  game.columns[column].push(game.active[slot]);
  game.active[slot] = null;
  updateControls();
}

function shuffle() {
  if (!shuffleUses) return;
  shuffleUses--;
  const cards = game.columns.flat();
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  // Put an available color in front when one exists.
  const next = cards.findIndex(card => getTarget(card.color) >= 0);
  if (next >= 0) [cards[0], cards[next]] = [cards[next], cards[0]];
  game.columns = Array.from({ length:5 }, (_, i) => cards.filter((_, j) => j % 5 === i));
  if (game.active.every(Boolean) && !game.ants.length) releaseSlot();
  updateControls();
}

function clipRound(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

function label(value, x, y, options = {}) {
  ctx.font = `900 ${options.size || 15}px system-ui, "Microsoft YaHei", sans-serif`;
  ctx.textAlign = options.align || "center";
  ctx.textBaseline = "middle";
  ctx.lineJoin = "round";
  const text = String(value);
  ctx.strokeStyle = options.stroke || "#382c2d89";
  ctx.lineWidth = options.line || 2.1;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = options.fill || "#fffdf9";
  ctx.fillText(text, x, y);
}

function shade(color, change) {
  const value = Number.parseInt(color.slice(1), 16);
  const parts = [value >> 16, (value >> 8) & 255, value & 255].map(part => Math.max(0, Math.min(255, part + change)));
  return `rgb(${parts.join(",")})`;
}

function faceColor(card) {
  return card.face || level.colors[card.color];
}

function drawCard(card, x, y, active = false) {
  const color = faceColor(card);
  const w = active ? 65 : 63;
  const h = active ? 40 : 38;
  if (active) {
    clipRound(x + 8, y - 5, w - 16, 17, 4);
    ctx.fillStyle = shade(color, -15);
    ctx.fill();
  }
  const fill = ctx.createLinearGradient(x, y, x, y + h);
  fill.addColorStop(0, shade(color, 17));
  fill.addColorStop(0.43, color);
  fill.addColorStop(1, shade(color, -12));
  clipRound(x, y, w, h, 6);
  ctx.fillStyle = shade(color, -25);
  ctx.fill();
  clipRound(x + 1.6, y + 1, w - 3.2, h - 3.1, 5);
  ctx.fillStyle = fill;
  ctx.fill();
  clipRound(x + 2.6, y + 2, w - 5.2, h - 5, 4);
  ctx.lineWidth = 1;
  ctx.strokeStyle = "#ffffff35";
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + 5, y + h - 4);
  ctx.lineTo(x + w - 5, y + h - 4);
  ctx.strokeStyle = "#422b2d26";
  ctx.stroke();
  label(card.count, x + w / 2, y + h * 0.54, { size:22, line:2.4 });
}

function cellTopLeft(index) {
  return {
    x: BOARD_X + (index % COLUMNS) * CELL_W,
    y: BOARD_Y - 256 + Math.floor(index / COLUMNS) * CELL_H,
  };
}

function eraseTile(index) {
  const { x, y } = cellTopLeft(index);
  tileCtx.clearRect(x, y, CELL_W, CELL_H);
}

function renderTiles() {
  tileCtx.clearRect(0, 0, boardLayer.width, boardLayer.height);
  game.grid.forEach((id, index) => {
    if (id < 0) return;
    const { x, y } = cellTopLeft(index);
    const color = level.colors[id];
    const delta = (index * 17 % 19) - 9;
    const w = CELL_W - 0.46, h = CELL_H - 0.46;
    tileCtx.beginPath();
    tileCtx.roundRect(x + 0.22, y + 0.21, w, h, 0.86);
    tileCtx.fillStyle = shade(color, -37 + delta);
    tileCtx.fill();
    const gradient = tileCtx.createLinearGradient(x, y, x + 0.2, y + h);
    gradient.addColorStop(0, shade(color, 24 + delta));
    gradient.addColorStop(0.35, shade(color, 7 + delta));
    gradient.addColorStop(1, shade(color, -7 + delta));
    tileCtx.beginPath();
    tileCtx.roundRect(x + 0.63, y + 0.55, w - 0.82, h - 1.23, 0.69);
    tileCtx.fillStyle = gradient;
    tileCtx.fill();
    tileCtx.fillStyle = "#fff7e249";
    tileCtx.fillRect(x + 1.31, y + 0.84, w - 2.18, 0.75);
  });
}

function drawBoard() {
  ctx.drawImage(boardLayer, 0, 256);
}

function drawStats() {
  const green = { fill:"#32634b", stroke:"#f8f3d2", size:15, align:"left", line:2.1 };
  label(coins, 127, 71.5, { fill:"#835a2c", stroke:"#fff5df", size:13, align:"left", line:1 });
  label(totalScore, 121, 110, green);
  label(game.score, 127, 135, green);
  label("×" + chests, 62, 197, { fill:"#6e5336", stroke:"#fff2cb", size:13 });
  label(stamina, 87, 238, { align:"left", size:13, line:1.6, stroke:"#40573a" });
  label(game.remaining, 237, 238, green);
  label(speed === 1 ? "×1" : "×2", 129, 178, { fill:"#f5f8d5", stroke:"#416b52", size:16, line:2 });
  ctx.save();
  clipRound(285, 231, 111, 15, 8);
  ctx.clip();
  const meter = ctx.createLinearGradient(0, 231, 0, 246);
  meter.addColorStop(0, "#b9df94");
  meter.addColorStop(1, "#77ad56");
  ctx.fillStyle = "#ad8462";
  ctx.fillRect(285, 231, 111, 15);
  ctx.fillStyle = meter;
  ctx.fillRect(285, 231, 111 * game.remaining / CELL_COUNT, 15);
  ctx.restore();
  label("×2", 184, 879, { stroke:"#8b5229", size:14 });
  label("×" + freeUses, 280, 879, { fill:freeSelection ? "#ffe794" : "#fffdf9", stroke:"#8b5229", size:14 });
  label("×" + shuffleUses, 373, 879, { stroke:"#8b5229", size:14 });
}

function drawDeck() {
  game.active.forEach((card, i) => {
    if (card && time - (card.chosenAt ?? -1) >= 0.245) drawCard(card, ACTIVE_X[i], 658, true);
  });
  ctx.save();
  clipRound(48, 724, 337, 90, 7);
  ctx.clip();
  game.columns.forEach((column, index) => {
    const progress = Math.max(0, Math.min(1, (game.slides[index] - time) / 0.235));
    for (let row = 0; row < PREVIEW_ROWS; row++) {
      if (!column[row]) continue;
      const x = QUEUE_X[index], y = 726 + row * CARD_PITCH + CARD_PITCH * progress ** 2;
      drawCard(column[row], x, y);
      if (freeSelection && row > 0) {
        clipRound(x + 0.5, y + 0.5, 62, 37, 6);
        ctx.strokeStyle = "#fff68a";
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
  });
  ctx.restore();
  if (game.launch) {
    const { card, fromX, fromY, toX, start } = game.launch;
    const elapsed = (time - start) / 0.245;
    if (elapsed < 1) {
      const ease = 1 - (1 - elapsed) ** 3;
      drawCard(card, fromX + (toX - fromX) * ease, fromY + (658 - fromY) * ease - 8 * Math.sin(elapsed * Math.PI));
    }
  }
}

function drawEffects() {
  for (const ant of game.ants) {
    const color = level.colors[ant.color];
    if (ant.age < 0.125) {
      const t = ant.age / 0.125;
      const x = ant.entryX + (NEST.x - ant.entryX) * t;
      drawAnt(ctx, x, 646 - 20 * t, Math.atan2(-20, NEST.x - ant.entryX), ant.age, color, false);
    } else {
      drawAnt(ctx, ant.point.x, ant.point.y, ant.angle, ant.age, color, ant.carry);
    }
  }
  for (const spark of game.sparks) {
    const t = spark.age / 0.35;
    ctx.save();
    if (spark.reward) {
      ctx.globalAlpha = Math.min(1, (1 - t) * 2);
      const x = spark.x + 92*t, y = spark.y - 34*Math.sin(t*Math.PI/2);
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.ellipse(x + i*9, y + (i%2)*4, 4, 6, 0.8, 0, Math.PI*2);
        ctx.fillStyle = "#ffd94b";
        ctx.fill();
        ctx.strokeStyle = "#d6921b";
        ctx.stroke();
      }
      ctx.restore();
      continue;
    }
    ctx.globalAlpha = (1 - t) ** 1.4 * 0.58;
    ctx.strokeStyle = "#fff9ca";
    ctx.lineWidth = Math.max(0.45, 1.6 - t);
    ctx.beginPath();
    ctx.arc(spark.x, spark.y, 2 + t * 8, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = "#fff8d6";
    for (let i = 0; i < 5; i++) {
      const angle = i * Math.PI * 0.4;
      ctx.fillRect(spark.x + Math.cos(angle) * t * 12, spark.y + Math.sin(angle) * t * 10, 1.7, 1.7);
    }
    ctx.restore();
  }
  for (const cloud of game.puffs) {
    const t = cloud.age / 0.68;
    ctx.save();
    ctx.globalAlpha = (1 - t) ** 1.25 * cloud.strength;
    for (let i = 0; i < 7; i++) {
      const angle = i * 2.4 + cloud.phase;
      const x = NEST.x + Math.cos(angle) * (4 + 21 * t);
      const y = NEST.y - 3 - t * 30 + Math.sin(angle) * (3 + 12 * t);
      const radius = 6 + 12 * t;
      const fog = ctx.createRadialGradient(x, y, 0, x, y, radius);
      fog.addColorStop(0, "#fffaf0");
      fog.addColorStop(0.45, "#fff2d3bf");
      fog.addColorStop(1, "#fff2d300");
      ctx.fillStyle = fog;
      ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
    }
    ctx.restore();
  }
}

function paintShell() {
  if (shellReady) return;
  if (garden.complete && garden.naturalWidth) {
    shellCtx.drawImage(garden, 0, 0, WIDTH, HEIGHT);
    shellReady = true;
  } else {
    const sky = shellCtx.createLinearGradient(0, 0, 0, HEIGHT);
    sky.addColorStop(0, "#91cbd4");
    sky.addColorStop(0.23, "#e0e7af");
    sky.addColorStop(0.40, "#f8e8b9");
    sky.addColorStop(1, "#f0d8a1");
    shellCtx.fillStyle = sky;
    shellCtx.fillRect(0, 0, WIDTH, HEIGHT);
    shellReady = garden.complete;
  }
  drawGameShell(shellCtx);
}

function paint() {
  const scale = canvas.width / WIDTH;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  paintShell();
  ctx.drawImage(shell, 0, 0);
  drawBoard();
  drawStats();
  drawDeck();
  drawEffects();
}

function frame(now) {
  const dt = lastFrame ? Math.min(0.04, (now - lastFrame) / 1000) : 0;
  lastFrame = now;
  if (!panel.open) update(dt * speed);
  paint();
  requestAnimationFrame(frame);
}

function resize() {
  const pixelRatio = Math.min(3, window.devicePixelRatio || 1);
  const width = Math.max(432, Math.round(canvas.clientWidth * pixelRatio));
  canvas.width = width;
  canvas.height = Math.round(width * HEIGHT / WIDTH);
  ctx.imageSmoothingEnabled = true;
}

const queueButtons = Array.from({ length:5 }, () => []);
function button(name, x, y, w, h, action) {
  const button = document.createElement("button");
  button.className = "hit";
  button.setAttribute("aria-label", name);
  button.style.cssText = `left:${x/WIDTH*100}%;top:${y/HEIGHT*100}%;width:${w/WIDTH*100}%;height:${h/HEIGHT*100}%`;
  button.addEventListener("click", () => { setupAudio(); action(); });
  controls.append(button);
  return button;
}

function updateControls() {
  if (!game) return;
  const colorNames = level.names || level.colorNames || [];
  queueButtons.forEach((column, i) => column.forEach((button, row) => {
    const card = game.columns[i][row];
    button.hidden = !card || (row > 0 && !freeSelection);
    if (card) button.setAttribute("aria-label", `第${i+1}列，${colorNames[card.color] || "方块"} ${card.count}`);
  }));
}

function showPanel(heading, copy, actions) {
  if (panel.open) return;
  panelHeading.textContent = heading;
  panelCopy.textContent = copy;
  panelActions.replaceChildren();
  panelCallback = null;
  for (const action of actions) {
    const button = document.createElement("button");
    button.textContent = action.text;
    button.addEventListener("click", () => { panelCallback = action.action; });
    panelActions.append(button);
  }
  panel.showModal();
}

panel.addEventListener("close", () => {
  const callback = panelCallback;
  panelCallback = null;
  if (callback) callback();
});

const showHelp = () => showPanel("玩法说明", "点下方第一排的色块。蚂蚁会从中间的洞口出发，把露出的同色方块搬回去。暂时够不到的颜色会留在上方五个槽里。", [{ text:"继续游戏" }]);
const showRestart = () => showPanel("结束游戏？", "重新开始会恢复花园的初始棋盘。", [{ text:"继续游戏" }, { text:"重新开始", action:reset }]);
button("返回", 6, 50, 47, 44, showRestart);
button("玩法说明", 58, 51, 39, 39, showHelp);
button("声音设置", 310, 53, 109, 34, () => {
  showPanel("声音设置", soundEnabled ? "气泡声已开启" : "气泡声已关闭", [
    { text:"返回" }, { text:soundEnabled ? "关闭声音" : "开启声音", action:() => { soundEnabled = !soundEnabled; setupAudio(); } }
  ]);
});
button("复活", 27, 602, 77, 48, () => showPanel("复活", "可以把暂时无法出发的一组蚂蚁移回下方。", [{ text:"返回" }, { text:"移回一组", action:releaseSlot }]));
button("结束游戏", 33, 834, 70, 76, showRestart);
button("加速2倍", 131, 834, 72, 76, () => { speed = speed === 1 ? 2 : 1; playSound("tap"); });
button("自由选择", 226, 834, 68, 76, () => {
  if (freeUses > 0) { freeSelection = !freeSelection; updateControls(); playSound("tap"); }
});
button("随机打乱", 319, 834, 73, 76, () => { shuffle(); playSound("tap"); });
queueButtons.forEach((column, i) => {
  for (let row = 0; row < 2; row++) {
    column.push(button("方块", QUEUE_X[i], 726 + row * CARD_PITCH, 63, 38, () => choose(i, row)));
  }
});

reset();
resize();
window.addEventListener("resize", resize);
requestAnimationFrame(frame);
</script>
</html>
